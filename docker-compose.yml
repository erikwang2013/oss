# 单机版：oss-server（S3 + 控制面 API，:9000）+ 控制台（nginx，:8080）。
#   docker compose up --build
# 数据与暂存在具名卷里（down 不丢；docker compose down -v 才清）。
services:
  oss:
    build: .
    image: oss-server:dev
    environment:
      OSS_ADMIN_USER: erik
      # 密钥没填（oss.toml 留空）就自动生成并落盘 ./docker/secrets/generated.env：
      # 0600 / 属主 oss（宿主用 docker compose exec 或 sudo 查看），重启复用；删文件=整体轮换。
      OSS_SECRETS_FILE: /secrets/generated.env
    # 容器内就绪探针（镜像含 curl）；TLS 部署需按实际监听改 scheme。
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health/live"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
    ports:
      # 默认只绑回环，避免未配置 TLS/鉴权前直接暴露公网；对外见 README「Docker」。
      - "127.0.0.1:9000:9000"
    volumes:
      - oss-data:/data
      - oss-staging:/staging
      # 自动生成的密钥落这里（宿主可见；已 gitignore）
      - ./docker/secrets:/secrets
      # 改配置改这里（只读挂载覆盖镜像内默认 /app/oss.toml）
      - ./docker/oss.toml:/app/oss.toml:ro
    restart: unless-stopped

  console:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    image: oss-console:dev
    # nginx:alpine 自带 busybox wget；等 oss 健康后再起，避免反代上游未就绪。
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      oss:
        condition: service_healthy
    restart: unless-stopped

volumes:
  oss-data:
  oss-staging:
