# 单机版：oss-server（S3 + 控制面 API，:9000）+ 控制台（nginx，:8080）。
#   docker compose up --build
# 数据与暂存在具名卷里（down 不丢；docker compose down -v 才清）。
services:
  oss:
    build: .
    image: oss-server:dev
    environment:
      OSS_ADMIN_USER: erik
      # 密钥没填（oss.toml 留空）就自动生成并落盘 ./docker/secrets/generated.env：
      # 宿主可直读（cat 看管理员口令），重启复用；删文件=整体轮换。
      OSS_SECRETS_FILE: /secrets/generated.env
    ports:
      - "9000:9000"
    volumes:
      - oss-data:/data
      - oss-staging:/staging
      # 自动生成的密钥落这里（宿主可见；已 gitignore）
      - ./docker/secrets:/secrets
      # 改配置改这里（只读挂载覆盖镜像内默认 /app/oss.toml）
      - ./docker/oss.toml:/app/oss.toml:ro
    restart: unless-stopped

  console:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    image: oss-console:dev
    ports:
      - "8080:80"
    depends_on:
      - oss
    restart: unless-stopped

volumes:
  oss-data:
  oss-staging:
