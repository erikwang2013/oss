# 控制台反代：静态 SPA + /api/v1、/aetherupload、/health 转发到 oss-server。
# S3 协议面不走这里——S3 客户端直连 oss-server 的 9000 端口（签名/流式与反代无关）。
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA 路由回退
    location / {
        try_files $uri /index.html;
    }

    location /api/v1/ {
        proxy_pass http://oss:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 分块上传：不缓冲请求体（流式透传），限额放宽到 oss.toml 的 max_put_bytes 之上
    location /aetherupload/ {
        proxy_pass http://oss:9000;
        proxy_set_header Host $host;
        proxy_request_buffering off;
        client_max_body_size 512m;
    }

    location /health/ {
        proxy_pass http://oss:9000;
    }
}
