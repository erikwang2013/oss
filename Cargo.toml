[workspace]
resolver = "2"
members = ["crates/xl-store", "crates/xl-s3", "crates/oss-server", "crates/xl-proto", "crates/xl-client"]

[workspace.package]
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"

[workspace.dependencies]
xl-store = { path = "crates/xl-store" }
xl-s3 = { path = "crates/xl-s3" }
xl-client = { path = "crates/xl-client" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1"
uuid = { version = "1", features = ["v4", "serde"] }
md-5 = "0.11"
sha2 = "0.11"
hex = "0.4"
thiserror = "2"
bytes = "1"
futures = "0.3"
tokio = { version = "1", features = ["fs", "io-util", "sync", "rt", "rt-multi-thread", "macros", "signal", "time", "net"] }
tokio-util = { version = "0.7", features = ["io"] }
tracing = "0.1"

# 发布版依赖：绝不加 "0.8" 之外的 axum —— ecat 与 aetherupload 都锚定 axum 0.8
# features 显式声明 oss-server 实际用到的（json=Json、query=Query、tokio=serve、http1=serve 的协议）；
# 不依赖 ecat/aetherupload 的特性合并把 default-features=false 悄悄补齐。
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio", "multipart"] }
s3s = "0.17"
aetherupload-rust = { version = "3.0.0", features = ["ecat"] }
reed-solomon-erasure = "6.0.0"
crc32c = "0.6"
# M5 钦定（设计 §依赖表）：DEK wrap = AES-256-GCM（RustCrypto；默认 features 带 getrandom → OsRng）
aes-gcm = "0.10"
# M5 切片 3：SSE-C 的 base64 钥/key-MD5 编解码（AWS 线格式）
base64 = "0.22"
rskafka = { version = "0.6", default-features = false }
# M6 切片 2：S3 Select 的 SQL AST（AWS 方言求值器自写）
sqlparser = "0.53"
# M6 切片 2：GZIP 输入解压（纯 Rust backend）
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# M5 切片 4：对象锁 retain-until 的时间换算（s3s::dto::Timestamp ↔ OffsetDateTime）
time = "0.3"
# M6 切片 4：复制出站客户端（SigV4 签名 + hyper http1 直连；与 s3s 同族版本）
s3s-sigv4 = "0.17"
hyper = { version = "1", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
ecat = { version = "7.0.0", features = ["http", "middleware", "tracing"] }
sqlx = { version = "0.9", default-features = false, features = ["sqlite", "runtime-tokio", "macros", "migrate"] }
