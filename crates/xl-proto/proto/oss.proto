syntax = "proto3";
package oss.v1;
service Mesh {
  rpc WriteShard(ShardWrite) returns (WriteResp);
  rpc ReadShard(ShardRead) returns (ShardResp);
  rpc DeleteVersion(VersionDirRef) returns (WriteResp);
  rpc RecycleVersion(VersionDirRef) returns (WriteResp);
  rpc DeleteShard(ShardDelete) returns (WriteResp);
  rpc PrepareMeta(MetaWrite) returns (MetaAck);
  rpc CommitMeta(MetaWrite) returns (MetaAck);
  rpc AbortMeta(MetaWrite) returns (WriteResp);
  rpc ReadMeta(MetaRead) returns (MetaResp);
  rpc DeleteMeta(MetaRead) returns (WriteResp);
  rpc EnsureBucket(BucketRef) returns (WriteResp);
  rpc DeleteBucket(BucketRef) returns (WriteResp);
  rpc ListBuckets(Empty) returns (BucketsResp);
  rpc ListLocal(ListReq) returns (ListLocalResp);
  // ListMultipartUploads 的单节点页（集群并集：与 ListLocal 同一完备性口径）
  rpc ListUploadsLocal(UploadListReq) returns (UploadListLocalResp);
  // M3 MPU 会话粘性：Create 留在接收节点，其余 MPU 操作按 upload_id 前缀转发给属主。
  // UploadPart 走客户端流：首块带元数据，后续块带 data；末块 is_final=true，
  // 接收端未见末块即按截断拒收（绝不提交半截 part）。
  rpc UploadPart(stream MpuPartChunk) returns (MpuUploadPartResp);
  rpc CompleteUpload(MpuCompleteReq) returns (MpuOpResp);
  rpc AbortUpload(MpuRef) returns (MpuOpResp);
  rpc ListParts(MpuRef) returns (MpuOpResp);
  rpc Health(Empty) returns (NodeHealth);
  rpc Lock(LockReq) returns (LockResp);
  rpc ControlQuery(ControlReq) returns (ControlResp);
  // M5 切片 0（P4-1）：控制面**白名单写**（桶行变更广播；接收端只写本地 DB）
  rpc ControlWrite(ControlWriteReq) returns (WriteResp);
}
message Empty {}  message WriteResp { bool ok = 1; string msg = 2; }
message ShardWrite { string bucket=1; string key=2; string uuid=3; uint32 part=4;
                     uint32 shard=5; uint32 crc32c=6; bytes data=7;
                     // M4 切片 2 分块写：chunked=true 时忽略 crc32c、校验 chunk_crc32c 并把
                     // data 写到分片文件 offset 处（offset=0 先截断）；is_final=true 时 fsync。
                     // chunked=false = 旧整片语义（crc32c 校验全体，行为不变）。
                     bool chunked=8; uint64 offset=9; uint32 chunk_crc32c=10; bool is_final=11;
                     // M4 切片 5：请求方携带槽位（meta 的 ShardRef.drive / 搬迁前老槽）；
                     // 服务端只校验归属并按槽拼路径，**不再重算放置公式**（新旧公式并存会
                     // 让存量对象远端面全错——设计评审 A）。
                     uint32 slot=12;
                     // M4 切片 8（多 set）：桶钉定的 EC 组号（缺省 0 = 单 set 兼容）；
                     // 槽为**组内**槽，服务端按 sets[set] 校验归属并按 (set, 槽) 拼路径。
                     uint32 set=13; }
message ShardRead  { string bucket=1; string key=2; string uuid=3; uint32 part=4; uint32 shard=5;
                     // M4 切片 2：length=0 = 整片（旧语义）；否则读 [offset, offset+length)
                     //（短读视同缺失——崩溃半截件由 EC 重建兜底）。
                     uint64 offset=6; uint64 length=7;
                     uint32 slot=8;
                     uint32 set=9; }
message ShardDelete { string bucket=1; string key=2; string uuid=3; uint32 part=4; uint32 shard=5;
                      uint32 slot=6; uint32 set=7; }
message ShardResp  { bool found=1; uint32 crc32c=2; bytes data=3; }
message VersionDirRef { string bucket=1; string key=2; string uuid=3; }
message MetaWrite { string bucket=1; string key=2; bytes meta=3; }
message SlotAck { uint32 slot=1; bool ok=2; bytes hash=3; }
message MetaAck { bool ok=1; string msg=2; repeated SlotAck slots=3; uint32 slots_ok=4; }
message MetaRead  { string bucket=1; string key=2; }
message MetaResp  { bool found=1; bytes meta=2; int64 mod_time_nanos=3; uint32 slots_ok=4; }
message BucketRef { string bucket=1; }  message BucketsResp { repeated string names=1; }
message ListReq { string bucket=1; string prefix=2; string delimiter=3; string marker=4; uint32 limit=5;
                  bool include_deleted=6;
                  // V1 ListObjects：marker 为排他起点（旧节点忽略 = 包含式，仅影响 v1 续页）
                  bool marker_exclusive=7; }
message ListEntry { string key=1; uint64 size=2; string etag=3; int64 max_mod_time_nanos=4; }
message ListLocalResp { repeated ListEntry entries=1; repeated string prefixes=2; uint32 slots_ok=3; }
// LMU 单节点页：空串 ↔ None（与 ListReq 同款线上约定）；limit = max-uploads + 1
message UploadListReq { string bucket=1; string prefix=2; string delimiter=3; string key_marker=4;
                        string upload_id_marker=5; uint32 limit=6; }
message UploadEntry { string key=1; string upload_id=2; int64 initiated_nanos=3; string storage_class=4; }
message UploadListLocalResp { repeated UploadEntry uploads=1; repeated string prefixes=2; uint32 slots_ok=3; }
// DP-0 数据面滚动升级握手：data_wire_version = 本节点支持的数据面线格式。
// 旧节点无此字段（proto3 缺省 0）→ 消费方一律按 1 处理；本版宣告 2。
// 拓扑指纹（dproll M1 / shrink topo v4 共用）：topo_epoch=1 为 placement v1，2 为 v2；
// topo_hash 为 EC 参数 + 每 set 节点表（按 id 排序）的 SHA-256 前 8 字节 hex（16 字符）。
// 旧节点两字段缺省 0/空串 → 消费方按「未宣告」处理，绝不当成匹配。
message NodeHealth { string node_id=1; string version=2; repeated SlotState slots=3; uint64 buckets=4;
                     uint32 data_wire_version=5;
                     uint64 topo_epoch=6; string topo_hash=7;
                     // shrink plan 容量校验：逐物理盘可用空间；maintenance = 停写维护模式。
                     repeated DriveSpace drives=8; bool maintenance=9; }
message SlotState { uint32 slot=1; bool up=2; }
message DriveSpace { uint32 set=1; uint32 drive=2; uint64 free_bytes=3; }
message LockReq { string bucket=1; string key=2; int64 epoch_nanos=3; string epoch_node=4;
                  string holder=5; uint64 ttl_ms=6; LockOp op=7; }
enum LockOp { ACQUIRE=0; RENEW=1; RELEASE=2; }
message LockResp { bool granted=1; }
message ControlReq { ControlKind kind=1; string a=2; string b=3; uint32 c=4; int64 uid=5; }
enum ControlKind { ACCESS_KEY=0; PERMISSION=1; OWNED_BUCKETS=2; VISIBLE_BUCKETS=3; BUCKET_OWNER=4;
                   // M4 切片 8：桶 → set（a = bucket）；found=false = 无行（set 字段仅在 found=true 有效）
                   BUCKET_SET=5; }
message ControlResp { bool found=1; int64 uid=2; bool is_admin=3; bool active=4;
                      string secret=5; bool flag=6; repeated string names=7;
                      // M4 切片 8：BUCKET_SET 应答（found=true 时有效）
                      uint32 set=8;
                      // M5 切片 5：ACCESS_KEY 应答——会话策略原文（含 session 交集求值用）
                      string session_policy=9; }
message ControlWriteReq {
  // 目前唯一 kind：BUCKET_ROW_SET（a=bucket；has_set=true → set=值；false → 删行）
  uint32 kind=1; string a=2; bool has_set=3; uint32 set=4;
}

// ---------- M3 MPU 会话粘性转发 ----------
message MpuRef { string bucket=1; string key=2; string upload_id=3; }
message MpuPartChunk {
  // 首块必带元数据（bucket/key/upload_id/part_number；sse_c_md5 空串 = 无 SSE-C）。
  string bucket=1; string key=2; string upload_id=3; uint32 part_number=4;
  string sse_c_md5=5; bytes data=6;
  // 末块标记。接收端在流结束时未见此标记 → 按截断报错并清理 `.new`。
  bool is_final=7;
  // 发送端 body 出错：接收端拒收并清理（不得落成半截 part）。
  bool abort=8; string error=9;
}
message MpuUploadPartResp { bool ok=1; string etag=2; string code=3; string msg=4; }
message MpuPart { uint32 number=1; string etag=2; }
message MpuCompleteReq {
  MpuRef target=1;
  repeated MpuPart parts=2;
  // 0=Off 1=Enabled 2=Suspended：前端节点按本地控制面解析后透传，属主据此落地。
  uint32 versioning_mode=3;
  // 加密意图：0=无 1=SSE-S3 2=SSE-KMS 3=显式 CMK 4=SSE-C（sse_c_key = 原始 32B；
  // 仅集群内网传输，SSE-C 跨节点场景建议启用 mesh TLS）。
  uint32 enc_kind=4; string enc_cmk=5; bytes sse_c_key=6;
  // 对象锁意图（直调 store API 才可能非空；S3 面由 create 记录后自主落地）。
  bool has_lock=7; string lock_mode=8; int64 lock_until_nanos=9; bool lock_legal_hold=10;
}
message MpuPartRow { uint32 number=1; uint64 size=2; string etag=3; }
message MpuOpResp {
  bool ok=1; string code=2; string msg=3;
  // Complete：ObjectInfo 的 msgpack（字段面由 xl-store 的 serde 派生钉住）。
  bytes info=4;
  // ListParts：升序段表。
  repeated MpuPartRow parts=5;
}
