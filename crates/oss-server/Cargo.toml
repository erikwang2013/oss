[package]
name = "oss-server"
version = "1.18.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "oss-server"
path = "src/main.rs"

[dependencies]
xl-store.workspace = true
bytes.workspace = true
xl-client.workspace = true
argon2 = "0.5"
async-trait = "0.1"
uuid.workspace = true
xl-s3.workspace = true
rskafka.workspace = true
time.workspace = true
aetherupload-rust.workspace = true
axum.workspace = true
ecat.workspace = true
ecat-transport.workspace = true
ecat-metrics.workspace = true
rustls.workspace = true
tokio-rustls.workspace = true
rustls-pemfile.workspace = true
rustls-native-certs.workspace = true
tonic.workspace = true
ecat-logging = "7.0.0"
futures.workspace = true
hex.workspace = true
# M8 S4b：tier PUT 的 Content-MD5（归档任务计算，不依赖源 ETag 口径）
md-5.workspace = true
# JWT 鉴权/签发走 jwt-rust（同一内核：axum JwtLayer + encode）；feature `axum` 与 `ecat`
# 在 jwt-rust 里是同一对依赖（dep:axum + dep:tower），选 `axum` 只是点名我们用的适配层。
jwt-rust = { version = "1.0.1", features = ["axum"] }
serde.workspace = true
serde_json.workspace = true
s3s.workspace = true
s3s-sigv4.workspace = true
hyper.workspace = true
hyper-util.workspace = true
http-body-util.workspace = true
sha2.workspace = true
sqlx.workspace = true
tokio.workspace = true
tokio-util.workspace = true
toml = "1.1"
csv = "1"
# M8 S5：Inventory 数据文件 gzip
flate2.workspace = true
# M8：Inventory Parquet 输出（无 Arrow 依赖）
parquet.workspace = true
# M8 4.7：本地 tier 用 openat2(RESOLVE_BENEATH|NO_SYMLINKS) 拒绝根目录内符号链接逃逸
rustix = { version = "1", features = ["fs"] }
base64.workspace = true
tracing.workspace = true
# M9 S5：Raft 控制面。storage-v2 是 v2 storage traits 的编译前提（非默认 feature）；
# 关闭 generic-snapshot-data：快照数据为 Cursor<Vec<u8>>，分块传输由 openraft 内置。
# 版本 = wire/存储格式：pre-1.0 无兼容承诺，升级 openraft 必须换新协议代次并全停升级。
openraft = { version = "=0.9.25", features = ["serde", "storage-v2"] }
# M9 S5：Raft RPC HTTP 客户端（workspace 已锁定 rustls 版）。
# S7.1：write 转发/成员 CLI 用 .json()（只加 feature，不加依赖）。
reqwest = { workspace = true, features = ["json"] }

[features]
default = []
# M8 S2：WASM 变换器默认不编译；透传给 xl-s3。
olap-wasm = ["xl-s3/olap-wasm"]

[dev-dependencies]
# 测试用独立签发器造边界令牌（换 secret 的伪签、绝对 exp 的过期）：jsonwebtoken 只在测试里被引用。
jsonwebtoken = "11"
# bytes 只在集成测试里用（put_object 造体）；sqlx 是 [dependencies] 的重复声明，删
bytes.workspace = true
reqwest = { workspace = true, features = ["json"] }
tempfile = "3"
# TLS 集成测试用临时 CA/证书（ring provider，与运行时一致）。
rcgen = "0.14"
tokio = { workspace = true, features = ["full"] }
