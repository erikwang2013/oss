[package]
name = "oss-server"
version = "1.10.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "oss-server"
path = "src/main.rs"

[dependencies]
xl-store.workspace = true
bytes.workspace = true
xl-client.workspace = true
argon2 = "0.5"
async-trait = "0.1"
uuid.workspace = true
xl-s3.workspace = true
rskafka.workspace = true
time.workspace = true
aetherupload-rust.workspace = true
axum.workspace = true
ecat.workspace = true
ecat-logging = "7.0.0"
futures.workspace = true
hex.workspace = true
# JWT 鉴权/签发走 jwt-rust（同一内核：axum JwtLayer + encode）；feature `axum` 与 `ecat`
# 在 jwt-rust 里是同一对依赖（dep:axum + dep:tower），选 `axum` 只是点名我们用的适配层。
jwt-rust = { version = "1.0.1", features = ["axum"] }
serde.workspace = true
serde_json.workspace = true
s3s.workspace = true
s3s-sigv4.workspace = true
hyper.workspace = true
hyper-util.workspace = true
http-body-util.workspace = true
sha2.workspace = true
sqlx.workspace = true
tokio.workspace = true
tokio-util.workspace = true
toml = "1.1"
tracing.workspace = true

[dev-dependencies]
# 测试用独立签发器造边界令牌（换 secret 的伪签、绝对 exp 的过期）：jsonwebtoken 只在测试里被引用。
jsonwebtoken = "11"
md-5.workspace = true
# bytes 只在集成测试里用（put_object 造体）；sqlx 是 [dependencies] 的重复声明，删
bytes.workspace = true
reqwest = { version = "0.13", features = ["json", "stream"] }
tempfile = "3"
tokio = { workspace = true, features = ["full"] }
