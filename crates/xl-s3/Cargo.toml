[package]
name = "xl-s3"
version = "1.16.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
xl-store.workspace = true
async-trait = "0.1"
bytes.workspace = true
futures.workspace = true
# Range 的 206 需要 http::StatusCode（s3s 不 re-export）；http 本就在依赖树里（s3s 直连），非新增 crate
http = "1"
# AP DeleteObjects 流式读取上限错误类型（http_body_util::Limited；s3s 不 re-export）
http-body-util.workspace = true
time.workspace = true
# M4 切片 7：桶策略的 JSON 解析（serde 已在依赖树里——s3s 直连，非新增 crate 语系）
serde.workspace = true
serde_json.workspace = true
s3s.workspace = true
tokio.workspace = true
sqlx = { workspace = true }
tracing.workspace = true
# M6 切片 2：S3 Select（SQL AST + GZIP/BZIP2）
sqlparser.workspace = true
flate2.workspace = true
bzip2.workspace = true
# S3 Select Parquet 输入：低层 row reader（default-features=false，不拉 Arrow）；
# json 仅启用 Row::to_json_value（serde_json/base64 本就在依赖树）
parquet = { workspace = true, features = ["json"] }
# M8 S2：Object Lambda（HTTP 变换器出站 + 输出 ETag / key-b64）
reqwest.workspace = true
base64.workspace = true
md-5.workspace = true
hex.workspace = true
# STS AssumeRoleWithWebIdentity：OIDC JWT/JWKS 校验（已在依赖树/锁文件中，非新增 crate 语系）
jsonwebtoken = { version = "11", features = ["aws_lc_rs"] }
# 仅 olap-wasm feature：36.x 是支持 MSRV 1.86 的维护分支（49.x 需 1.96，超出工作区 1.89）
wasmtime = { version = "36", default-features = false, features = ["cranelift", "runtime", "std", "wat"], optional = true }

[features]
default = []
olap-wasm = ["dep:wasmtime"]

[dev-dependencies]
tempfile = "3"
axum.workspace = true
