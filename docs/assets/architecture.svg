<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" width="960" height="720"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <title>OSS 系统架构</title>
  <desc>三个 crate 的单向依赖：oss-server（ecat + axum）→ xl-s3 → xl-store，以及客户端与存储介质。</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="958" height="718" rx="14" fill="#ffffff" stroke="#e5e7eb"/>

  <text x="40" y="46" font-size="20" font-weight="700" fill="#0f172a">OSS · 系统架构</text>
  <text x="40" y="70" font-size="12" fill="#64748b">Rust 2024 · 三 crate 单向依赖 oss-server → xl-s3 → xl-store · M1：单进程、单盘（无纠删码）</text>

  <!-- 客户端 -->
  <rect x="690" y="94" width="250" height="56" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="815" y="118" font-size="13.5" font-weight="600" fill="#1e3a8a" text-anchor="middle">aws-cli / rclone</text>
  <text x="815" y="136" font-size="11" fill="#3b82f6" text-anchor="middle">S3 协议（SigV4 签名）</text>

  <rect x="170" y="94" width="440" height="56" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="390" y="118" font-size="13.5" font-weight="600" fill="#1e3a8a" text-anchor="middle">浏览器：控制台 SPA（React 19 + antd · Vite）</text>
  <text x="390" y="136" font-size="11" fill="#3b82f6" text-anchor="middle">aetherupload 分块上传脚本（断线续传 / 秒传）</text>

  <!-- 客户端 → 服务 -->
  <line x1="850" y1="150" x2="850" y2="228" stroke="#94a3b8" marker-end="url(#a)"/>
  <line x1="315" y1="150" x2="315" y2="228" stroke="#94a3b8" marker-end="url(#a)"/>
  <line x1="400" y1="150" x2="400" y2="228" stroke="#94a3b8" marker-end="url(#a)"/>

  <!-- oss-server 面板 -->
  <rect x="40" y="174" width="880" height="304" rx="12" fill="#fbfdff" stroke="#cbd5e1"/>
  <rect x="40" y="174" width="270" height="30" rx="8" fill="#e2e8f0" stroke="#cbd5e1"/>
  <text x="52" y="194" font-size="12.5" font-weight="600" fill="#334155">oss-server · ecat + axum（:9000）</text>

  <rect x="60" y="232" width="270" height="200" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="76" y="262" font-size="13" font-weight="600" fill="#0f172a">/api/v1/*　控制台 API</text>
  <text x="76" y="286" font-size="11" fill="#64748b">JwtLayer（jwt-rust · JWT 12h）</text>
  <text x="76" y="312" font-size="11" fill="#374151">登录 · 桶管理 · 对象列表/下载/删除</text>
  <text x="76" y="334" font-size="11" fill="#374151">上传记录 · 访问密钥</text>
  <text x="76" y="360" font-size="11" fill="#94a3b8">前端登录后种 cookie oss_token</text>

  <rect x="345" y="232" width="270" height="200" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="361" y="262" font-size="13" font-weight="600" fill="#0f172a">/aetherupload/*　分块上传</text>
  <text x="361" y="286" font-size="11" fill="#64748b">cookie→Bearer 垫片 + JwtLayer</text>
  <text x="361" y="312" font-size="10.5" fill="#374151">preprocess · uploading · display · download</text>
  <text x="361" y="334" font-size="11" fill="#374151">秒传索引（SQLite instant_index）</text>
  <text x="361" y="360" font-size="11" fill="#374151">完成事件 → IngestSink 原生 ingest</text>

  <rect x="630" y="232" width="270" height="200" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="646" y="262" font-size="13" font-weight="600" fill="#0f172a">S3 fallback（s3s 0.17）</text>
  <rect x="646" y="274" width="238" height="36" rx="6" fill="#f8fafc" stroke="#dbe3ec"/>
  <text x="765" y="290" font-size="10.5" fill="#374151" text-anchor="middle">解析请求 + SigV4 验签</text>
  <text x="765" y="304" font-size="10" fill="#64748b" text-anchor="middle">AK → SK 查 access_keys 表</text>
  <line x1="765" y1="310" x2="765" y2="326" stroke="#94a3b8" marker-end="url(#a)"/>
  <rect x="646" y="330" width="238" height="36" rx="6" fill="#f8fafc" stroke="#dbe3ec"/>
  <text x="765" y="346" font-size="10.5" fill="#374151" text-anchor="middle">OssS3（xl-s3）</text>
  <text x="765" y="360" font-size="10" fill="#64748b" text-anchor="middle">S3 trait → 内核（M1 无授权）</text>
  <text x="646" y="392" font-size="11" fill="#374151">桶/对象 CRUD · ListObjectsV2 · Copy</text>
  <text x="646" y="412" font-size="11" fill="#94a3b8">Multipart / Range 未实现（M2）</text>

  <!-- 面板脚注条 -->
  <line x1="40" y1="440" x2="920" y2="440" stroke="#e5e7eb"/>
  <text x="60" y="462" font-size="11" fill="#64748b">ecat 宿主 · 启动自举（建目录 / 连库 / 开存储 / 引导管理员）· 健康检查 /health/live · CLI：serve · groups · build · clean</text>

  <!-- 服务 → 内核 -->
  <line x1="195" y1="478" x2="195" y2="506" stroke="#94a3b8" marker-end="url(#a)"/>
  <line x1="400" y1="478" x2="400" y2="506" stroke="#94a3b8" marker-end="url(#a)"/>
  <line x1="590" y1="478" x2="590" y2="506" stroke="#94a3b8" marker-end="url(#a)"/>

  <!-- xl-store 内核面板 -->
  <rect x="40" y="510" width="620" height="84" rx="12" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="60" y="534" font-size="13" font-weight="600" fill="#166534">xl-store · 存储内核（不依赖任何框架）</text>
  <text x="60" y="556" font-size="11" fill="#374151">Store：per-object 锁 · 桶/对象/列举 · CopyObject</text>
  <text x="60" y="576" font-size="11" fill="#374151">提交协议：tmp → 同盘 rename → xl.meta 覆盖 ← 提交点 · 布局校验（__XLDIR__ 展平）· xl.meta v1 编解码</text>

  <!-- 控制面 → SQLite（虚线，绕过内核面板右侧） -->
  <line x1="850" y1="478" x2="850" y2="608" stroke="#94a3b8" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="840" y="548" font-size="10" fill="#94a3b8" text-anchor="end">控制面数据（SQL）</text>

  <!-- 内核 → 存储 -->
  <line x1="205" y1="594" x2="205" y2="608" stroke="#94a3b8" marker-end="url(#a)"/>
  <line x1="500" y1="594" x2="500" y2="608" stroke="#94a3b8" marker-end="url(#a)"/>

  <!-- 存储层 -->
  <rect x="60" y="612" width="270" height="80" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="76" y="634" font-size="12" font-weight="600" fill="#334155">data_dir 数据盘</text>
  <text x="76" y="650" font-size="10" fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">buckets/&lt;桶&gt;/&lt;展平键&gt;/</text>
  <text x="76" y="665" font-size="10" fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">{xl.meta, &lt;uuid&gt;/part.1}</text>
  <text x="76" y="680" font-size="10" fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">.oss.sys/{tmp, trash, locks}</text>

  <rect x="360" y="612" width="270" height="80" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="376" y="634" font-size="12" font-weight="600" fill="#334155">staging_dir 暂存盘</text>
  <text x="376" y="651" font-size="10" fill="#475569">分块 *.part → 服务端合并成品</text>
  <text x="376" y="667" font-size="10" fill="#475569">_header/ 断点 · 秒传命中直接跳过</text>

  <rect x="670" y="612" width="250" height="80" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="686" y="634" font-size="12" font-weight="600" fill="#334155">SQLite（控制面）</text>
  <text x="686" y="651" font-size="10" fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">users · access_keys · buckets</text>
  <text x="686" y="667" font-size="10" fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">uploads · instant_index</text>

  <text x="930" y="708" font-size="10" fill="#94a3b8" text-anchor="end">© erik.xyz</text>
</svg>
