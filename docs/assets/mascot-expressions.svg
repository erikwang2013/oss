<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 900 340" width="720" height="272"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <title>OSS 项目吉祥物表情形态（动态）</title>
  <desc>存储桶小家伙的五种动态表情：哭（落泪、抽泣）、笑（弹跳、腮红发亮）、沮丧（眼神下垂、褪色）、惊恐（颤抖、冷汗、泛白）、得意（金光闪烁、坏笑抽动）。</desc>
  <defs>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7ba3cc"/>
      <stop offset="1" stop-color="#55779c"/>
    </linearGradient>
    <linearGradient id="insideGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22303f"/>
      <stop offset="1" stop-color="#31445a"/>
    </linearGradient>

    <g id="bucket">
      <ellipse cx="280" cy="492" rx="185" ry="16" fill="#0f172a" opacity="0.07"/>
      <ellipse cx="280" cy="200" rx="170" ry="58" fill="url(#insideGrad)"/>
      <g>
        <rect x="166" y="222" width="44" height="40" rx="6" fill="#60a5fa" stroke="#3b82f6" stroke-width="1.2"/>
        <polygon points="166,222 188,205 232,205 210,222" fill="#bfdbfe" stroke="#3b82f6" stroke-width="1.2"/>
        <polygon points="210,222 232,205 232,245 210,262" fill="#3b82f6"/>
      </g>
      <g>
        <rect x="256" y="216" width="44" height="44" rx="6" fill="#4ade80" stroke="#22c55e" stroke-width="1.2"/>
        <polygon points="256,216 278,197 322,197 300,216" fill="#bbf7d0" stroke="#22c55e" stroke-width="1.2"/>
        <polygon points="300,216 322,197 322,241 300,260" fill="#22c55e"/>
      </g>
      <g>
        <rect x="338" y="226" width="44" height="38" rx="6" fill="#2dd4bf" stroke="#14b8a6" stroke-width="1.2"/>
        <polygon points="338,226 360,209 404,209 382,226" fill="#99f6e4" stroke="#14b8a6" stroke-width="1.2"/>
        <polygon points="382,226 404,209 404,245 382,264" fill="#14b8a6"/>
      </g>
      <path d="M450,200 A170,58 0 0 1 110,200 C104,260 132,370 162,430 A118,44 0 0 0 398,430 C428,370 456,260 450,200 Z"
            fill="url(#bodyGrad)"/>
      <path d="M152,272 C144,330 152,382 176,412" fill="none" stroke="#ffffff" stroke-width="13" stroke-linecap="round" opacity="0.2"/>
      <path d="M156,378 A124,44 0 0 0 404,378" fill="none" stroke="#46617f" stroke-width="2" opacity="0.5"/>
      <path fill-rule="evenodd" fill="#9ebcdf" d="M110,200 A170,58 0 0 1 450,200 A170,58 0 0 1 110,200 Z M128,200 A152,46 0 0 0 432,200 A152,46 0 0 0 128,200 Z"/>
      <ellipse cx="228" cy="462" rx="34" ry="15" fill="#46617f"/>
      <ellipse cx="332" cy="462" rx="34" ry="15" fill="#46617f"/>
      <circle cx="394" cy="410" r="10" fill="#4ade80" opacity="0.25"/>
      <circle cx="394" cy="410" r="5" fill="#4ade80"/>
    </g>
  </defs>

  <!-- 哭：抽泣收缩的眼、脉搏式泪痕、两颗交替滴落、嘴颤动 -->
  <g transform="translate(-26,24) scale(0.45)">
    <use xlink:href="#bucket" href="#bucket"/>
    <path d="M206,290 Q222,282 238,290" fill="none" stroke="#22303f" stroke-width="4" stroke-linecap="round"/>
    <path d="M322,290 Q338,282 354,290" fill="none" stroke="#22303f" stroke-width="4" stroke-linecap="round"/>
    <ellipse cx="222" cy="318" rx="15" ry="17" fill="#22303f">
      <animate attributeName="ry" values="17;14;17" dur="1.8s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="338" cy="318" rx="15" ry="17" fill="#22303f">
      <animate attributeName="ry" values="17;14;17" dur="1.8s" repeatCount="indefinite"/>
    </ellipse>
    <circle cx="227" cy="311" r="4.5" fill="#ffffff"/>
    <circle cx="343" cy="311" r="4.5" fill="#ffffff"/>
    <ellipse cx="194" cy="340" rx="17" ry="9" fill="#f0b9a6" opacity="0.35"/>
    <ellipse cx="366" cy="340" rx="17" ry="9" fill="#f0b9a6" opacity="0.35"/>
    <ellipse cx="222" cy="344" rx="4.5" ry="12" fill="#a8d8fb">
      <animate attributeName="opacity" values="0.75;0.4;0.75" dur="2s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="338" cy="344" rx="4.5" ry="12" fill="#a8d8fb">
      <animate attributeName="opacity" values="0.75;0.4;0.75" dur="2s" repeatCount="indefinite"/>
    </ellipse>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 20" dur="2.4s" begin="0s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;1;0" keyTimes="0;0.7;1" dur="2.4s" begin="0s" repeatCount="indefinite"/>
      <path d="M222,352 C229,358 229,368 222,371 C215,368 215,358 222,352 Z" fill="#7cc4f8"/>
      <circle cx="219" cy="360" r="1.8" fill="#ffffff" opacity="0.8"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 20" dur="2.4s" begin="1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;1;0" keyTimes="0;0.7;1" dur="2.4s" begin="1.2s" repeatCount="indefinite"/>
      <path d="M338,352 C345,358 345,368 338,371 C331,368 331,358 338,352 Z" fill="#7cc4f8"/>
      <circle cx="335" cy="360" r="1.8" fill="#ffffff" opacity="0.8"/>
    </g>
    <ellipse cx="280" cy="336" rx="6.5" ry="5" fill="#33506d"/>
    <path d="M262,362 Q280,349 298,362" fill="none" stroke="#22303f" stroke-width="2.6" stroke-linecap="round">
      <animate attributeName="d" values="M262,362 Q280,349 298,362;M262,363 Q280,346 298,363;M262,362 Q280,349 298,362" dur="0.9s" repeatCount="indefinite"/>
    </path>
  </g>
  <text x="100" y="300" font-size="15" fill="#64748b" text-anchor="middle">哭</text>

  <!-- 笑：双眼交替蹦起、大笑嘴弹跳、腮红呼吸发亮 -->
  <g transform="translate(154,24) scale(0.45)">
    <use xlink:href="#bucket" href="#bucket"/>
    <path d="M206,320 Q222,304 238,320" fill="none" stroke="#22303f" stroke-width="5.5" stroke-linecap="round">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="0.9s" begin="0s" repeatCount="indefinite"/>
    </path>
    <path d="M322,320 Q338,304 354,320" fill="none" stroke="#22303f" stroke-width="5.5" stroke-linecap="round">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="0.9s" begin="0.45s" repeatCount="indefinite"/>
    </path>
    <ellipse cx="194" cy="342" rx="19" ry="10" fill="#f0b9a6">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="366" cy="342" rx="19" ry="10" fill="#f0b9a6">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="280" cy="334" rx="6.5" ry="5" fill="#33506d"/>
    <g transform="translate(280,360)">
      <g>
        <animateTransform attributeName="transform" type="scale" values="1 1;1.1 0.88;1 1" dur="0.9s" repeatCount="indefinite"/>
        <path d="M-24,-16 Q0,18 24,-16 Z" fill="#22303f"/>
        <ellipse cx="0" cy="2" rx="10" ry="6" fill="#f2a68f"/>
      </g>
    </g>
  </g>
  <text x="280" y="300" font-size="15" fill="#64748b" text-anchor="middle">笑</text>

  <!-- 沮丧：眼神缓缓下垂、嘴轻微下沉、桶身褪色呼吸 -->
  <g transform="translate(334,24) scale(0.45)">
    <use xlink:href="#bucket" href="#bucket"/>
    <path d="M450,200 A170,58 0 0 1 110,200 C104,260 132,370 162,430 A118,44 0 0 0 398,430 C428,370 456,260 450,200 Z"
          fill="#8b98aa" opacity="0">
      <animate attributeName="opacity" values="0;0.32;0" keyTimes="0;0.5;1" dur="4.4s" repeatCount="indefinite"/>
    </path>
    <path d="M206,300 L238,306" stroke="#22303f" stroke-width="4" stroke-linecap="round"/>
    <path d="M322,306 L354,300" stroke="#22303f" stroke-width="4" stroke-linecap="round"/>
    <ellipse cx="222" cy="318" rx="16" ry="10" fill="#22303f"/>
    <ellipse cx="338" cy="318" rx="16" ry="10" fill="#22303f"/>
    <circle cx="226" cy="315" r="3.5" fill="#ffffff">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 4;0 0" keyTimes="0;0.5;1" dur="3.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="342" cy="315" r="3.5" fill="#ffffff">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 4;0 0" keyTimes="0;0.5;1" dur="3.4s" repeatCount="indefinite"/>
    </circle>
    <ellipse cx="194" cy="340" rx="17" ry="9" fill="#f0b9a6" opacity="0.3"/>
    <ellipse cx="366" cy="340" rx="17" ry="9" fill="#f0b9a6" opacity="0.3"/>
    <ellipse cx="280" cy="336" rx="6.5" ry="5" fill="#33506d"/>
    <path d="M266,358 Q280,352 294,358" fill="none" stroke="#22303f" stroke-width="2.4" stroke-linecap="round">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 2;0 0" keyTimes="0;0.5;1" dur="3.4s" repeatCount="indefinite"/>
    </path>
  </g>
  <text x="460" y="300" font-size="15" fill="#64748b" text-anchor="middle">沮丧</text>

  <!-- 惊恐：眼球与惊吓线高频颤抖、小圆嘴张合、冷汗下滑、桶身泛白闪动 -->
  <g transform="translate(514,24) scale(0.45)">
    <use xlink:href="#bucket" href="#bucket"/>
    <path d="M450,200 A170,58 0 0 1 110,200 C104,260 132,370 162,430 A118,44 0 0 0 398,430 C428,370 456,260 450,200 Z"
          fill="#d7e8f8" opacity="0">
      <animate attributeName="opacity" values="0;0.22;0" keyTimes="0;0.5;1" dur="1.6s" repeatCount="indefinite"/>
    </path>
    <path d="M206,284 Q222,272 238,284" fill="none" stroke="#22303f" stroke-width="4" stroke-linecap="round"/>
    <path d="M322,284 Q338,272 354,284" fill="none" stroke="#22303f" stroke-width="4" stroke-linecap="round"/>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;1.6 -1;-1.6 1;0 0" keyTimes="0;0.3;0.6;1" dur="0.22s" repeatCount="indefinite"/>
      <ellipse cx="222" cy="318" rx="19" ry="24" fill="#22303f"/>
      <circle cx="227" cy="309" r="3.5" fill="#ffffff"/>
      <circle cx="216" cy="328" r="2.2" fill="#ffffff" opacity="0.85"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;1.6 -1;-1.6 1;0 0" keyTimes="0;0.3;0.6;1" dur="0.22s" begin="0.05s" repeatCount="indefinite"/>
      <ellipse cx="338" cy="318" rx="19" ry="24" fill="#22303f"/>
      <circle cx="343" cy="309" r="3.5" fill="#ffffff"/>
      <circle cx="332" cy="328" r="2.2" fill="#ffffff" opacity="0.85"/>
    </g>
    <ellipse cx="280" cy="336" rx="6.5" ry="5" fill="#33506d"/>
    <ellipse cx="280" cy="358" rx="8.5" ry="11" fill="#22303f">
      <animate attributeName="rx" values="8.5;10.5;8.5" dur="0.5s" repeatCount="indefinite"/>
      <animate attributeName="ry" values="11;13.5;11" dur="0.5s" repeatCount="indefinite"/>
    </ellipse>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 16" dur="2.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;1;0" keyTimes="0;0.75;1" dur="2.2s" repeatCount="indefinite"/>
      <path d="M382,244 C390,254 390,264 382,267 C374,264 374,254 382,244 Z" fill="#7cc4f8"/>
      <circle cx="379" cy="254" r="1.8" fill="#ffffff" opacity="0.8"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;-1.5 1;1.5 -1;0 0" keyTimes="0;0.3;0.6;1" dur="0.18s" repeatCount="indefinite"/>
      <path d="M404,214 L413,200" stroke="#22303f" stroke-width="3" stroke-linecap="round"/>
      <path d="M418,228 L431,220" stroke="#22303f" stroke-width="3" stroke-linecap="round"/>
    </g>
  </g>
  <text x="640" y="300" font-size="15" fill="#64748b" text-anchor="middle">惊恐</text>

  <!-- 得意：挑眉轻晃、坏笑抽动、眼睛缓缓眯起、金光闪烁变色 -->
  <g transform="translate(694,24) scale(0.45)">
    <use xlink:href="#bucket" href="#bucket"/>
    <path d="M206,300 L238,298" stroke="#22303f" stroke-width="4" stroke-linecap="round"/>
    <path d="M322,282 L354,278" stroke="#22303f" stroke-width="4" stroke-linecap="round">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -2;0 0" dur="2.6s" repeatCount="indefinite"/>
    </path>
    <ellipse cx="222" cy="315" rx="16" ry="13" fill="#22303f">
      <animate attributeName="ry" values="13;11;13" dur="3.2s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="338" cy="315" rx="16" ry="13" fill="#22303f">
      <animate attributeName="ry" values="13;11.5;13" dur="3.2s" begin="0.3s" repeatCount="indefinite"/>
    </ellipse>
    <circle cx="228" cy="310" r="4" fill="#ffffff"/>
    <circle cx="344" cy="310" r="4" fill="#ffffff"/>
    <ellipse cx="194" cy="340" rx="17" ry="9" fill="#f0b9a6" opacity="0.5"/>
    <ellipse cx="366" cy="340" rx="17" ry="9" fill="#f0b9a6" opacity="0.5"/>
    <ellipse cx="280" cy="336" rx="6.5" ry="5" fill="#33506d"/>
    <g transform="translate(280,352)">
      <g>
        <animateTransform attributeName="transform" type="scale" values="1 1;1.06 1.05;1 1" dur="2.6s" repeatCount="indefinite"/>
        <path d="M-18,4 Q0,14 22,-4" fill="none" stroke="#22303f" stroke-width="2.6" stroke-linecap="round"/>
      </g>
    </g>
    <g transform="translate(396,292)">
      <g>
        <animateTransform attributeName="transform" type="scale" values="1;1.3;1" dur="1.4s" repeatCount="indefinite"/>
        <path d="M0,-10 L3,-3 L10,0 L3,3 L0,10 L-3,3 L-10,0 L-3,-3 Z" fill="#f59e0b">
          <animate attributeName="fill" values="#f59e0b;#fde68a;#f59e0b" dur="1.4s" repeatCount="indefinite"/>
        </path>
      </g>
    </g>
  </g>
  <text x="820" y="300" font-size="15" fill="#64748b" text-anchor="middle">得意</text>

  <text x="884" y="326" font-size="10" fill="#94a3b8" text-anchor="end">© erik.xyz</text>
</svg>
