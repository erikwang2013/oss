<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 560" width="240" height="240"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <title>OSS 项目吉祥物</title>
  <desc>一只存储桶小家伙：桶口露出三块彩色对象立方体，戴着绿色状态灯；会眨眼，方块轮流蹦起。</desc>
  <defs>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7ba3cc"/>
      <stop offset="1" stop-color="#55779c"/>
    </linearGradient>
    <linearGradient id="insideGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22303f"/>
      <stop offset="1" stop-color="#31445a"/>
    </linearGradient>
  </defs>

  <!-- 地面阴影 -->
  <ellipse cx="280" cy="492" rx="185" ry="16" fill="#0f172a" opacity="0.07"/>

  <!-- 桶口（内部） -->
  <ellipse cx="280" cy="200" rx="170" ry="58" fill="url(#insideGrad)"/>

  <!-- 桶里囤着的对象立方体 -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -28;0 0" keyTimes="0;0.45;1"
                      calcMode="spline" keySplines="0.25 0 0.3 1;0.5 0 0.7 1" dur="3.6s" begin="0.4s" repeatCount="indefinite"/>
    <rect x="166" y="222" width="44" height="40" rx="6" fill="#60a5fa" stroke="#3b82f6" stroke-width="1.2"/>
    <polygon points="166,222 188,205 232,205 210,222" fill="#bfdbfe" stroke="#3b82f6" stroke-width="1.2"/>
    <polygon points="210,222 232,205 232,245 210,262" fill="#3b82f6"/>
  </g>
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -36;0 0" keyTimes="0;0.45;1"
                      calcMode="spline" keySplines="0.25 0 0.3 1;0.5 0 0.7 1" dur="3.6s" begin="1.6s" repeatCount="indefinite"/>
    <rect x="256" y="216" width="44" height="44" rx="6" fill="#4ade80" stroke="#22c55e" stroke-width="1.2"/>
    <polygon points="256,216 278,197 322,197 300,216" fill="#bbf7d0" stroke="#22c55e" stroke-width="1.2"/>
    <polygon points="300,216 322,197 322,241 300,260" fill="#22c55e"/>
  </g>
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -24;0 0" keyTimes="0;0.45;1"
                      calcMode="spline" keySplines="0.25 0 0.3 1;0.5 0 0.7 1" dur="3.6s" begin="2.8s" repeatCount="indefinite"/>
    <rect x="338" y="226" width="44" height="38" rx="6" fill="#2dd4bf" stroke="#14b8a6" stroke-width="1.2"/>
    <polygon points="338,226 360,209 404,209 382,226" fill="#99f6e4" stroke="#14b8a6" stroke-width="1.2"/>
    <polygon points="382,226 404,209 404,245 382,264" fill="#14b8a6"/>
  </g>

  <!-- 桶身 -->
  <path d="M450,200 A170,58 0 0 1 110,200 C104,260 132,370 162,430 A118,44 0 0 0 398,430 C428,370 456,260 450,200 Z"
        fill="url(#bodyGrad)"/>
  <path d="M152,272 C144,330 152,382 176,412" fill="none" stroke="#ffffff" stroke-width="13" stroke-linecap="round" opacity="0.2"/>
  <path d="M156,378 A124,44 0 0 0 404,378" fill="none" stroke="#46617f" stroke-width="2" opacity="0.5"/>

  <!-- 桶唇（整环，避免两个半环在左右极点拼接出的平切缝） -->
  <path fill-rule="evenodd" fill="#9ebcdf" d="M110,200 A170,58 0 0 1 450,200 A170,58 0 0 1 110,200 Z M128,200 A152,46 0 0 0 432,200 A152,46 0 0 0 128,200 Z"/>

  <!-- 脚 -->
  <ellipse cx="228" cy="462" rx="34" ry="15" fill="#46617f"/>
  <ellipse cx="332" cy="462" rx="34" ry="15" fill="#46617f"/>

  <!-- 脸 -->
  <ellipse cx="222" cy="315" rx="16" ry="19" fill="#22303f">
    <animate attributeName="ry" values="19;19;2;19;19" keyTimes="0;0.88;0.93;0.98;1" dur="4.4s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="338" cy="315" rx="16" ry="19" fill="#22303f">
    <animate attributeName="ry" values="19;19;2;19;19" keyTimes="0;0.88;0.93;0.98;1" dur="4.4s" repeatCount="indefinite"/>
  </ellipse>
  <circle cx="227" cy="307" r="5.5" fill="#ffffff">
    <animate attributeName="r" values="5.5;5.5;0;5.5;5.5" keyTimes="0;0.88;0.93;0.98;1" dur="4.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="343" cy="307" r="5.5" fill="#ffffff">
    <animate attributeName="r" values="5.5;5.5;0;5.5;5.5" keyTimes="0;0.88;0.93;0.98;1" dur="4.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="216" cy="325" r="3" fill="#ffffff" opacity="0.85">
    <animate attributeName="r" values="3;3;0;3;3" keyTimes="0;0.88;0.93;0.98;1" dur="4.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="332" cy="325" r="3" fill="#ffffff" opacity="0.85">
    <animate attributeName="r" values="3;3;0;3;3" keyTimes="0;0.88;0.93;0.98;1" dur="4.4s" repeatCount="indefinite"/>
  </circle>
  <ellipse cx="194" cy="338" rx="17" ry="9" fill="#f0b9a6" opacity="0.5"/>
  <ellipse cx="366" cy="338" rx="17" ry="9" fill="#f0b9a6" opacity="0.5"/>
  <ellipse cx="280" cy="338" rx="6.5" ry="5" fill="#33506d"/>
  <path d="M262,350 Q280,363 298,350" fill="none" stroke="#22303f" stroke-width="2.6" stroke-linecap="round"/>

  <!-- 状态灯 -->
  <circle cx="394" cy="410" r="10" fill="#4ade80" opacity="0.25"/>
  <circle cx="394" cy="410" r="5" fill="#4ade80"/>

  <text x="548" y="545" font-size="10" fill="#94a3b8" text-anchor="end">© erik.xyz</text>
</svg>
