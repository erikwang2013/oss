listen = "0.0.0.0:9000"
data_dir = "./data"
staging_dir = "./staging"
database_url = "sqlite://./oss.db?mode=rwc"
# jwt-rust 要求 ≥32 字符（256 位）；本值仅限本机开发
jwt_secret = "dev-only-change-me-0123456789abcdef"
max_put_bytes = 268435456

# 多盘（M2b）：配了 data_dirs 则忽略 data_dir。EC 8+4 冗余需 ≥ 12 盘；
# 单盘可运行（分片同盘、无冗余，启动会 warn）。**首启前确认各盘挂载点已挂载**
#（首启时「未挂载的挂载点目录」与全新盘不可区分，会被当作新盘初始化）。
# data_dirs = ["./disk0", "./disk1", "./disk2", "./disk3", "./disk4", "./disk5",
#              "./disk6", "./disk7", "./disk8", "./disk9", "./disk10", "./disk11"]

[ec]
# enabled = true   # false = M1 旧形态（单文件、无内联、无分片），只允许单盘
# data = 8         # 数据片；parity = 4 校验片（默认 8+4）
# parity = 4
# inline_threshold = 131072  # 小于该长度的对象内联进 xl.meta（默认 128 KiB，上限同值）

[[groups]]
group = "image"
bucket = "images"
max_size = 10485760
extensions = ["jpg", "jpeg", "png", "gif", "webp", "svg"]

[[groups]]
group = "video"
bucket = "videos"
max_size = 0
extensions = ["mp4", "mov", "mkv", "webm"]

[[groups]]
group = "file"
bucket = "files"
max_size = 0
extensions = []

# STS AssumeRoleWithWebIdentity（默认关闭）。启用后该 Action 无需 AK/SK，凭据是 OIDC
# token；只映射可信 IdP 的**精确** claim 值。JWKS 只从本地文件读（不拉 URL，无 SSRF）。
# [sts.web_identity]
# enabled = false
# issuer = "https://token.actions.githubusercontent.com"   # 精确匹配 iss；必须 https
# audience = "oss-prod"                                    # 精确匹配 aud
# jwks_file = "/etc/oss/oidc-jwks.json"                    # 启动时读入；只允许 RS256/ES256
# max_duration_seconds = 3600                              # 900..=43200
# [[sts.web_identity.roles]]
# role_arn = "arn:oss:iam::oss:role/ci-bot"                # role/<name> 须是已有活跃用户
# claim = "sub"                                            # 只支持 sub / email，精确匹配
# values = ["repo:acme/infra:ref:refs/heads/main"]
