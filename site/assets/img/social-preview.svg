<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 640" width="1280" height="640"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <title>OSS —— 自研分布式对象存储 / Self-built Distributed Object Storage</title>
  <desc>中英双语的社交预览图：左侧为项目吉祥物（装着对象块的存储桶），右侧为项目名、核心能力（TLS/SASL、版本、加密、锁、多站点、AP/OLAP）与版本号。</desc>
  <defs>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7ba3cc"/>
      <stop offset="1" stop-color="#55779c"/>
    </linearGradient>
    <linearGradient id="insideGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22303f"/>
      <stop offset="1" stop-color="#31445a"/>
    </linearGradient>
    <linearGradient id="bgTint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef5fc"/>
      <stop offset="0.55" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f6fbf7"/>
    </linearGradient>

    <g id="bucket">
