  <text x="530" y="272" font-size="40" font-weight="600" fill="#0f172a">自研分布式对象存储系统</text>
  <text x="530" y="314" font-size="21" fill="#64748b">Self-built, S3-compatible · TLS/CMK · Strong consistency</text>

