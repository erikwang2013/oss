name: CI

# 仅手动触发（用户要求：不要自动跑 CI——push/PR 不再自动起任务；
# 需要时在 GitHub Actions 页面对本 workflow 点「Run workflow」）。
on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "1"
      CARGO_PROFILE_TEST_DEBUG: "1"
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@v4
      - name: 检测 workspace 是否就绪
        id: detect
        run: echo "ready=$([ -f Cargo.toml ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Install protoc
        if: steps.detect.outputs.ready == 'true'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: rustfmt
        if: steps.detect.outputs.ready == 'true'
        run: cargo fmt --all --check
      - uses: Swatinem/rust-cache@v2
        if: steps.detect.outputs.ready == 'true'
      - name: clippy
        if: steps.detect.outputs.ready == 'true'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: test
        if: steps.detect.outputs.ready == 'true'
        run: cargo test --workspace --locked --no-fail-fast
      - name: 跳过提示
        if: steps.detect.outputs.ready != 'true'
        run: echo "Cargo.toml 尚未存在（规划阶段），跳过 Rust 检查"

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 检测 web 是否就绪
        id: detect
        run: echo "ready=$([ -f web/package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.detect.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: web 构建与单测
        if: steps.detect.outputs.ready == 'true'
        working-directory: web
        run: npm ci && npm run build && npm test
      - name: 跳过提示
        if: steps.detect.outputs.ready != 'true'
        run: echo "web/package.json 尚未存在（M1b 未开工），跳过 web 检查"
